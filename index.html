<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year End Review — Individual Development Plan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
  :root {
    --border: #000000;
    --ref-bg: #fafafa;
    --label: #222;
    --accent: #01A8DC;
    --text: #555;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    font-weight: 600;
    background: #fff;
    margin: 0;
    padding: 32px;
    line-height: 1.5;
  }
  .sheet { max-width: 860px; margin: 0 auto; }

  header h1 { font-size: 25px; margin: 0 0 4px; }
  header p  { margin: 0 0 24px; color: var(--label); font-size: 20px; }

  .namebar, .rolebar { margin-bottom: 32px; }
  .namebar label, .rolebar label {
    display: block; font-size: 12px; text-transform: uppercase;
    letter-spacing: .4px; color: var(--label); margin-bottom: 6px;
  }
  .namebar input, .rolebar select {
    width: 100%; max-width: 420px; font-family: inherit; font-size: 14px;
    font-weight: 600; padding: 10px; border: 1px solid var(--border);
    border-radius: 3px; color: var(--text); background: #fff;
  }
  .namebar input:focus, .rolebar select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .part-title {
    font-size: 25px; font-weight: bold; text-transform: uppercase;
    letter-spacing: .5px; color: var(--accent);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 6px; margin: 40px 0 16px;
  }

  .row { border: 1px solid var(--border); margin-bottom: 16px; }
  .row-ref {
    background: var(--ref-bg); padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .row-ref .rownum {
    font-weight: bold; color: var(--accent); font-size: 13px; margin-bottom: 6px;
  }
  .field { margin-bottom: 8px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: .4px; color: var(--label); margin-bottom: 2px;
  }
  .field .val { font-size: 13px; white-space: pre-line; }

  .row-input { padding: 14px 16px; display: grid;
    grid-template-columns: 220px 1fr; gap: 16px; }
  .row-input label {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: .4px; color: var(--label); margin-bottom: 4px;
  }
  select, textarea {
    width: 100%; font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 8px; border: 1px solid var(--border); border-radius: 3px;
    color: var(--text); background: #fff;
  }
  textarea { resize: vertical; min-height: 70px; }
  select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .placeholder-msg {
    padding: 40px; text-align: center; color: var(--label);
    border: 1px dashed var(--border); border-radius: 4px; font-size: 14px;
  }

  /* custom KRA/KPI row */
  .custom-ref { background: #eef8fc; }
  .custom-ref input, .custom-ref textarea {
    width: 100%; font-family: inherit; font-size: 13px; font-weight: 600;
    padding: 6px; border: 1px solid var(--border); border-radius: 3px;
    color: var(--text); background: #fff; margin-top: 2px;
  }
  .custom-ref .tgt-input { max-width: 120px; }
  .add-btn {
    display: inline-block; margin: 4px 0 20px; padding: 8px 16px;
    background: #fff; color: var(--accent); border: 1px dashed var(--accent);
    border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 13px;
    font-weight: 600;
  }
  .add-btn:hover { background: #eef8fc; }
  .remove-btn {
    float: right; background: none; border: none; color: #b00;
    cursor: pointer; font-size: 12px; font-weight: 600; padding: 0;
  }

  .actions { margin-top: 40px; text-align: right; }
  button {
    font-family: inherit; font-size: 14px; padding: 10px 24px;
    background: var(--accent); color: #fff; border: none;
    border-radius: 3px; cursor: pointer;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<div class="sheet">

  <header>
    <h1>Individual Development Plan — Year End Review</h1>
    <p>Employee self-assessment. Rate each item and add your comments.</p>
  </header>

  <div class="namebar">
    <label for="empName">Employee Name</label>
    <input type="text" id="empName" placeholder="e.g. Jane Doe" autocomplete="off">
  </div>

  <!-- ROLE SELECTOR: drives which question set renders -->
  <div class="rolebar">
    <label for="roleSelect">Role / Position</label>
    <select id="roleSelect" onchange="renderRole()">
      <option value="">— Select a role —</option>
    </select>
  </div>

  <div id="parts">
    <div class="placeholder-msg">Select a role above to load the review questions.</div>
  </div>

  <div class="actions">
    <button id="saveBtn" onclick="collect()">Generate supervisor PDF</button>
  </div>
</div>

<script>
const RATINGS = [
  "",
  "EXCEEDS EXPECTATIONS = Already achieved Target (3)",
  "MEETS EXPECTATIONS = Progressing/on-track towards Target (2)",
  "BELOW EXPECTATIONS = No Progress towards Target (1)"
];
const RATING_CHOICES = ["Exceeds Expectations (3)", "Meets Expectations (2)", "Below Expectations (1)"];

// ---- DATA MODEL: now keyed by ROLE. Each role has its own question set. ----
// Placeholder roles for now — swap in real Project Y content (or a DB fetch) later.
const ROLES = {
  "Role #1": {
    "PART 1: GOALS / KRA / KPI": {
      refFields: [
        ["Key Result Area (KRA) & KPI", "kra"],
        ["% of Target", "tgt"],
        ["Milestones / Projects", "mile"],
        ["Critical Competencies to Develop", "comp"]
      ],
      rows: [
        { kra:"[Role #1] KRA placeholder 1\nKPI: placeholder KPI text", tgt:"25%",
          mile:"Milestone placeholder 1", comp:"Competency placeholder 1" },
        { kra:"[Role #1] KRA placeholder 2\nKPI: placeholder KPI text", tgt:"30%",
          mile:"Milestone placeholder 2", comp:"Competency placeholder 2" }
      ]
    },
    "PART 2: COMPETENCIES": {
      refFields: [
        ["Category, Competency & Sub-competency", "cat"],
        ["Current Proficiency Level", "cur"],
        ["Target Proficiency Level", "tgt"],
        ["Development Plan", "dev"]
      ],
      rows: [
        { cat:"[Role #1] Sub-competency placeholder 1", cur:"Intermediate", tgt:"Expert",
          dev:"Development plan placeholder" },
        { cat:"[Role #1] Sub-competency placeholder 2", cur:"Proficient", tgt:"Expert",
          dev:"Development plan placeholder" }
      ]
    },
    "PART 3: VALUES": {
      refFields: [
        ["Value", "val"],
        ["Dimension", "dim"],
        ["Goal for the Year", "goal"]
      ],
      rows: [
        { val:"VALUE PLACEHOLDER A", dim:"Dimension placeholder", goal:"Goal placeholder" },
        { val:"VALUE PLACEHOLDER B", dim:"Dimension placeholder", goal:"Goal placeholder" }
      ]
    }
  },

  "Role #2": {
    "PART 1: GOALS / KRA / KPI": {
      refFields: [
        ["Key Result Area (KRA) & KPI", "kra"],
        ["% of Target", "tgt"],
        ["Milestones / Projects", "mile"],
        ["Critical Competencies to Develop", "comp"]
      ],
      rows: [
        { kra:"[Role #2] KRA placeholder 1\nKPI: placeholder KPI text", tgt:"40%",
          mile:"Milestone placeholder 1", comp:"Competency placeholder 1" }
      ]
    },
    "PART 2: COMPETENCIES": {
      refFields: [
        ["Category, Competency & Sub-competency", "cat"],
        ["Current Proficiency Level", "cur"],
        ["Target Proficiency Level", "tgt"],
        ["Development Plan", "dev"]
      ],
      rows: [
        { cat:"[Role #2] Sub-competency placeholder 1", cur:"Basic", tgt:"Proficient",
          dev:"Development plan placeholder" }
      ]
    },
    "PART 3: VALUES": {
      refFields: [
        ["Value", "val"],
        ["Dimension", "dim"],
        ["Goal for the Year", "goal"]
      ],
      rows: [
        { val:"VALUE PLACEHOLDER A", dim:"Dimension placeholder", goal:"Goal placeholder" }
      ]
    }
  },

  "Role #3": {
    "PART 1: GOALS / KRA / KPI": {
      refFields: [
        ["Key Result Area (KRA) & KPI", "kra"],
        ["% of Target", "tgt"],
        ["Milestones / Projects", "mile"],
        ["Critical Competencies to Develop", "comp"]
      ],
      rows: [
        { kra:"[Role #3] KRA placeholder 1\nKPI: placeholder KPI text", tgt:"20%",
          mile:"Milestone placeholder 1", comp:"Competency placeholder 1" },
        { kra:"[Role #3] KRA placeholder 2\nKPI: placeholder KPI text", tgt:"20%",
          mile:"Milestone placeholder 2", comp:"Competency placeholder 2" },
        { kra:"[Role #3] KRA placeholder 3\nKPI: placeholder KPI text", tgt:"15%",
          mile:"Milestone placeholder 3", comp:"Competency placeholder 3" }
      ]
    },
    "PART 2: COMPETENCIES": {
      refFields: [
        ["Category, Competency & Sub-competency", "cat"],
        ["Current Proficiency Level", "cur"],
        ["Target Proficiency Level", "tgt"],
        ["Development Plan", "dev"]
      ],
      rows: [
        { cat:"[Role #3] Sub-competency placeholder 1", cur:"Intermediate", tgt:"Expert",
          dev:"Development plan placeholder" }
      ]
    },
    "PART 3: VALUES": {
      refFields: [
        ["Value", "val"],
        ["Dimension", "dim"],
        ["Goal for the Year", "goal"]
      ],
      rows: [
        { val:"VALUE PLACEHOLDER A", dim:"Dimension placeholder", goal:"Goal placeholder" }
      ]
    }
  }
};

// ---- Populate the role dropdown from the ROLES keys ----
const roleSelect = document.getElementById("roleSelect");
Object.keys(ROLES).forEach(roleName => {
  const opt = document.createElement("option");
  opt.value = roleName;
  opt.textContent = roleName;
  roleSelect.appendChild(opt);
});

// ---- Custom KRA/KPI rows added by the employee, kept per role ----
let customRows = [];   // each: {kra, tgt, mile, comp} — matches Part 1 refFields

function addCustomRow() {
  customRows.push({ kra: "", tgt: "", mile: "", comp: "" });
  renderRole(true);    // re-render, preserving existing inputs
}
function removeCustomRow(i) {
  saveCustomInputs();
  customRows.splice(i, 1);
  renderRole(true);
}
// read what the user has typed into custom fields back into the store,
// so a re-render (add/remove) doesn't wipe their entries
function saveCustomInputs() {
  customRows.forEach((row, i) => {
    ["kra", "tgt", "mile", "comp"].forEach(k => {
      const el = document.getElementById(`custom_${i}_${k}`);
      if (el) row[k] = el.value;
    });
  });
}

// ---- RENDER: rebuild the form for the currently selected role ----
function renderRole(keepCustom) {
  // if switching roles (not just adding a row), clear custom rows
  if (!keepCustom) customRows = [];

  const container = document.getElementById("parts");
  container.innerHTML = "";

  const roleName = roleSelect.value;
  if (!roleName) {
    container.innerHTML = '<div class="placeholder-msg">Select a role above to load the review questions.</div>';
    return;
  }

  const DATA = ROLES[roleName];
  Object.entries(DATA).forEach(([partName, part], pIdx) => {
    const title = document.createElement("div");
    title.className = "part-title";
    title.textContent = partName;
    container.appendChild(title);

    part.rows.forEach((row, rIdx) => {
      const wrap = document.createElement("div");
      wrap.className = "row";
      let refHTML = `<div class="rownum">Item ${rIdx + 1}</div>`;
      part.refFields.forEach(([label, key]) => {
        refHTML += `<div class="field"><label>${label}</label>
          <div class="val">${row[key] || "—"}</div></div>`;
      });
      const ref = document.createElement("div");
      ref.className = "row-ref";
      ref.innerHTML = refHTML;

      const id = `p${pIdx}_r${rIdx}`;
      const options = RATINGS.map(r =>
        `<option value="${r}">${r || "— Select rating —"}</option>`).join("");
      const input = document.createElement("div");
      input.className = "row-input";
      input.innerHTML = `
        <div><label>Individual Rating</label>
          <select id="${id}_rate">${options}</select></div>
        <div><label>Individual Comments</label>
          <textarea id="${id}_cmt" placeholder="Your comments..."></textarea></div>`;
      wrap.appendChild(ref);
      wrap.appendChild(input);
      container.appendChild(wrap);
    });

    // ---- after Part 1: render any custom KRA/KPI rows + the Add button ----
    if (partName === "PART 1: GOALS / KRA / KPI") {
      customRows.forEach((crow, i) => {
        const wrap = document.createElement("div");
        wrap.className = "row";

        const ref = document.createElement("div");
        ref.className = "row-ref custom-ref";
        ref.innerHTML = `
          <div class="rownum">Custom Item ${i + 1}
            <button class="remove-btn" onclick="removeCustomRow(${i})">✕ remove</button>
          </div>
          <div class="field"><label>Key Result Area (KRA) &amp; KPI</label>
            <textarea id="custom_${i}_kra" placeholder="Describe the KRA and its KPI(s)...">${crow.kra || ""}</textarea></div>
          <div class="field"><label>% of Target</label>
            <input class="tgt-input" id="custom_${i}_tgt" value="${crow.tgt || ""}" placeholder="e.g. 10%"></div>
          <div class="field"><label>Milestones / Projects</label>
            <textarea id="custom_${i}_mile" placeholder="Milestones...">${crow.mile || ""}</textarea></div>
          <div class="field"><label>Critical Competencies to Develop</label>
            <textarea id="custom_${i}_comp" placeholder="Competencies...">${crow.comp || ""}</textarea></div>`;

        const id = `custom_p0_r${i}`;
        const options = RATINGS.map(r =>
          `<option value="${r}">${r || "— Select rating —"}</option>`).join("");
        const input = document.createElement("div");
        input.className = "row-input";
        input.innerHTML = `
          <div><label>Individual Rating</label>
            <select id="${id}_rate">${options}</select></div>
          <div><label>Individual Comments</label>
            <textarea id="${id}_cmt" placeholder="Your comments..."></textarea></div>`;

        wrap.appendChild(ref);
        wrap.appendChild(input);
        container.appendChild(wrap);
      });

      const addBtn = document.createElement("button");
      addBtn.className = "add-btn";
      addBtn.textContent = "+ Add custom KRA / KPI";
      addBtn.onclick = () => { saveCustomInputs(); addCustomRow(); };
      container.appendChild(addBtn);
    }
  });
}

// ---- COLLECT + BUILD FILLABLE PDF ----
async function collect() {
  const name = document.getElementById("empName").value.trim();
  if (!name) {
    alert("Please enter the employee name before saving.");
    document.getElementById("empName").focus();
    return;
  }
  const roleName = roleSelect.value;
  if (!roleName) {
    alert("Please select a role before saving.");
    roleSelect.focus();
    return;
  }

  saveCustomInputs();   // capture latest custom field text

  const DATA = ROLES[roleName];
  const out = [];
  Object.entries(DATA).forEach(([partName, part], pIdx) => {
    part.rows.forEach((row, rIdx) => {
      const id = `p${pIdx}_r${rIdx}`;
      out.push({
        part: partName,
        item: rIdx + 1,
        rating: document.getElementById(`${id}_rate`).value,
        comment: document.getElementById(`${id}_cmt`).value,
        ref: row,
        refFields: part.refFields
      });
    });

    // append custom KRA/KPI rows right after Part 1
    if (partName === "PART 1: GOALS / KRA / KPI") {
      customRows.forEach((crow, i) => {
        const id = `custom_p0_r${i}`;
        out.push({
          part: partName,
          item: `Custom ${i + 1}`,
          rating: document.getElementById(`${id}_rate`).value,
          comment: document.getElementById(`${id}_cmt`).value,
          ref: crow,
          refFields: part.refFields   // same 4 labels: kra, tgt, mile, comp
        });
      });
    }
  });

  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "Building PDF...";
  try {
    await buildPdf(name, roleName, out);
  } catch (e) {
    console.error(e);
    alert("Something went wrong building the PDF: " + e.message);
  }
  btn.disabled = false; btn.textContent = "Generate supervisor PDF";
}

async function buildPdf(name, roleName, rows) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const form = doc.getForm();

  const accent = rgb(0.004, 0.659, 0.863);
  const dark   = rgb(0.15, 0.15, 0.15);
  const grey   = rgb(0.42, 0.42, 0.42);

  const M = 45, PW = 612, PH = 792, CW = PW - M * 2;
  let page = doc.addPage([PW, PH]);
  let y = PH - M;

  function wrap(text, f, size, maxW) {
    const lines = [];
    (text || "").split("\n").forEach(para => {
      let line = "";
      para.split(" ").forEach(word => {
        const test = line ? line + " " + word : word;
        if (f.widthOfTextAtSize(test, size) > maxW && line) { lines.push(line); line = word; }
        else { line = test; }
      });
      lines.push(line);
    });
    return lines;
  }
  function need(space) { if (y - space < M) { page = doc.addPage([PW, PH]); y = PH - M; } }
  function drawText(text, f, size, color, x, maxW) {
    const lines = wrap(text, f, size, maxW);
    for (const ln of lines) {
      need(size + 4);
      page.drawText(ln, { x, y: y - size, size, font: f, color });
      y -= size + 3;
    }
  }

  page.drawText("Individual Development Plan — Year End Review", { x: M, y: y - 16, size: 16, font: bold, color: dark });
  y -= 26;
  page.drawText("Employee: " + name + "     Role: " + roleName, { x: M, y: y - 12, size: 11, font: font, color: grey });
  y -= 26;

  let fieldIdx = 0, lastPart = "";
  for (const r of rows) {
    if (r.part !== lastPart) {
      need(30); y -= 6;
      page.drawText(r.part, { x: M, y: y - 13, size: 13, font: bold, color: accent });
      y -= 20;
      page.drawLine({ start: { x: M, y }, end: { x: M + CW, y }, thickness: 1.5, color: accent });
      y -= 14; lastPart = r.part;
    }
    need(24);
    page.drawText(`Item ${r.item}`, { x: M, y: y - 11, size: 10, font: bold, color: accent });
    y -= 16;

    r.refFields.forEach(([label, key]) => {
      drawText(label.toUpperCase(), bold, 8, grey, M, CW);
      drawText(r.ref[key] || "—", font, 9, dark, M, CW);
      y -= 3;
    });
    y -= 4;

    drawText("EMPLOYEE RATING", bold, 8, grey, M, CW);
    drawText(r.rating || "—", font, 9, dark, M, CW);
    drawText("EMPLOYEE COMMENTS", bold, 8, grey, M, CW);
    drawText(r.comment || "—", font, 9, dark, M, CW);
    y -= 6;

    drawText("SUPERVISOR RATING", bold, 8, accent, M, CW);
    need(26);
    const dd = form.createDropdown(`sup_rating_${fieldIdx}`);
    dd.addOptions(RATING_CHOICES);
    dd.addToPage(page, { x: M, y: y - 20, width: 240, height: 18,
      textColor: dark, backgroundColor: rgb(1,1,1), borderColor: dark, borderWidth: 1, font });
    y -= 28;

    drawText("SUPERVISOR COMMENTS", bold, 8, accent, M, CW);
    need(56);
    const tf = form.createTextField(`sup_comment_${fieldIdx}`);
    tf.enableMultiline();
    tf.addToPage(page, { x: M, y: y - 50, width: CW, height: 48,
      textColor: dark, backgroundColor: rgb(1,1,1), borderColor: dark, borderWidth: 1, font });
    y -= 60;

    need(10);
    page.drawLine({ start: { x: M, y }, end: { x: M + CW, y }, thickness: 0.5, color: grey });
    y -= 12;
    fieldIdx++;
  }

  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  const bytes = await doc.save();
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${slug}_performance_report.pdf`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
