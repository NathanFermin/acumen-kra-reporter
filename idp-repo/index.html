    font-size: 25px; font-weight: bold; text-transform: uppercase;

  .row-ref {

  }

    font-weight: bold; color: var(--accent); font-size: 13px; margin-bottom: 6px;

  .field { margin-bottom: 8px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block; font-size: 11px; text-transform: uppercase;

    display: block; font-size: 11px; text-transform: uppercase;

  select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    width: 100%; max-width: 120px; font-family: inherit; font-size: 13px; font-weight: 600;

    color: var(--text); background: #fff; margin-top: 2px;

  .add-btn {
    display: inline-block; margin: 4px 0 20px; padding: 8px 16px;
    background: #fff; color: var(--accent); border: 1px dashed var(--accent);
    border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 13px;
    font-weight: 600;

  .remove-btn {

  }

  #toast {
    position: fixed; top: 20px; right: 20px; z-index: 1000;
    max-width: 320px; padding: 14px 18px; border-radius: 4px;

  button {
    font-family: inherit; font-size: 14px; padding: 10px 24px;
    background: var(--accent); color: #fff; border: none;
    border-radius: 3px; cursor: pointer;
  }

  button:disabled { opacity: .5; cursor: wait; }

      "kra": "Talent Development",

    {

      "definition": "Ensuring that activities and output of the talents meets the organization's goals in an effective and efficient manner. Focus on monitoring and evaluating the performance of a talent versus the agreed measures of success.",

    {

// ---- DATA MODEL: now keyed by ROLE. Each role has its own question set. ----
// Role list below is per the Project Y org roster. The roster listed "Associate" three
// times with no department/team given to tell them apart, and role names double as the
// keys of this object, so duplicates would just overwrite each other — only one generic
// "Associate" entry is kept. If the three should stay distinct, rename them (e.g.
// "Associate, Finance") and duplicate the "Associate" block below for each.
const ROLE_NAMES = [
  "BD Associate",
  "CB Operations Manager",
  "Finance Lead",
  "Finance Assistant",
  "Multimedia Designer",
  "Marketing Communications Lead",
  "Marketing Analyst",
  "President & CEO",
  "Operations Manager",
  "Lead, Project Support",
  "Associate",
  "Operations Assistant",
  "People & Culture Manager"
];

// labels shown/printed for each Part 1 row — KRA is picked from KRA_LIBRARY, everything
// else (including KPI) is free-text user input
const PART1_FIELDS = [
  ["Key Result Area (KRA)", "kraText"],
  ["Key Performance Indicator (KPI)", "kpi"],
  ["% of Target", "tgt"],
  ["Milestones / Projects", "mile"],
  ["Critical Competencies to Develop", "comp"]
];

function makeRolePlaceholder(roleName) {
  return {
    "PART 1: GOALS / KRA / KPI": {
      refFields: PART1_FIELDS,
      kraOptions: KRA_LIBRARY[roleName] || []
    },
    "PART 2: COMPETENCIES": {
      refFields: [
        ["Category, Competency & Sub-competency", "cat"],
        ["Current Proficiency Level", "cur"],
        ["Target Proficiency Level", "tgt"],
        ["Development Plan", "dev"]
      ],
      rows: [
        { cat:"[" + roleName + "] Sub-competency placeholder 1", cur:"Intermediate", tgt:"Expert",
          dev:"Development plan placeholder" },
        { cat:"[" + roleName + "] Sub-competency placeholder 2", cur:"Proficient", tgt:"Expert",
          dev:"Development plan placeholder" }
      ]
    },
    "PART 3: VALUES": {
      refFields: [
        ["Value", "val"],
        ["Dimension", "dim"],
        ["Goal for the Year", "goal"]
      ],
      rows: [
        { val:"VALUE PLACEHOLDER A", dim:"Dimension placeholder", goal:"Goal placeholder" },
        { val:"VALUE PLACEHOLDER B", dim:"Dimension placeholder", goal:"Goal placeholder" }
      ]
    }
  };
}

const ROLES = {};
ROLE_NAMES.forEach(roleName => { ROLES[roleName] = makeRolePlaceholder(roleName); });

// ---- Populate the role dropdown from the ROLES keys ----
const roleSelect = document.getElementById("roleSelect");
Object.keys(ROLES).forEach(roleName => {
  const opt = document.createElement("option");
  opt.value = roleName;
  opt.textContent = roleName;
  roleSelect.appendChild(opt);
});

// ---- PART 1 rows: each row lets the employee pick a KRA (from that role's KRA_LIBRARY
// options) and type in the KPI, milestones, competencies and % of Target as free text. ----
let part1Rows = [];   // each: {kra, kraOther, kpi, tgt, mile, comp}
function blankPart1Row() { return { kra: "", kraOther: "", kpi: "", tgt: "", mile: "", comp: "" }; }

function addPart1Row() {
  part1Rows.push(blankPart1Row());
  renderRole(true);    // re-render, preserving existing inputs
}
function removePart1Row(i) {
  savePart1Inputs();
  part1Rows.splice(i, 1);
  renderRole(true);
}
// read what the user has typed/selected in Part 1 fields back into the store,
// so a re-render (add/remove/KRA change) doesn't wipe their entries
function savePart1Inputs() {
  part1Rows.forEach((row, i) => {
    ["kra", "kraOther", "kpi", "tgt", "mile", "comp"].forEach(k => {
      const el = document.getElementById(`kra_${i}_${k}`);
      if (el) row[k] = el.value;
    });
  });
}
// called when a row's KRA dropdown changes — re-renders so the "Other" text box
// can appear/disappear, without losing anything else on the form
function onKraChange(i) {
  savePart1Inputs();
  renderRole(true);
}
function kraDisplayText(row) {
  return row.kra === "__other__" ? (row.kraOther || "") : (row.kra || "");
}

// ---- snapshot/restore all form field values across a re-render, so switching a KRA
// dropdown or adding/removing a row doesn't wipe ratings/comments elsewhere on the form ----
function snapshotFormState() {
  const state = {};
  document.querySelectorAll("#parts select, #parts textarea, #parts input").forEach(el => {
    if (el.id) state[el.id] = el.value;
  });
  return state;
}
function restoreFormState(state) {
  Object.entries(state).forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (el) el.value = val;
  });
}

// ---- RENDER: rebuild the form for the currently selected role ----
function renderRole(keepAll) {
  const priorState = keepAll ? snapshotFormState() : null;
  // if switching roles (not just adding/editing a row), start Part 1 fresh
  if (!keepAll) part1Rows = [blankPart1Row()];

  const container = document.getElementById("parts");
  container.innerHTML = "";

  const roleName = roleSelect.value;
  if (!roleName) {
    container.innerHTML = '<div class="placeholder-msg">Select a role above to load the review questions.</div>';
    return;
  }

  const DATA = ROLES[roleName];
  Object.entries(DATA).forEach(([partName, part], pIdx) => {
    const title = document.createElement("div");
    title.className = "part-title";
    title.textContent = partName;
    container.appendChild(title);

    if (partName === "PART 1: GOALS / KRA / KPI") {
      // ---- KRA/KPI rows: KRA is a dropdown of this role's competency-model options ----
      part1Rows.forEach((row, i) => {
        const wrap = document.createElement("div");
        wrap.className = "row";

        const kraOpts = part.kraOptions.map(opt =>
          `<option value="${opt.kra}" ${row.kra === opt.kra ? "selected" : ""}>${opt.kra}</option>`
        ).join("");
        const selected = part.kraOptions.find(opt => opt.kra === row.kra);

        const ref = document.createElement("div");
        ref.className = "row-ref custom-ref";
        ref.innerHTML = `
          <div class="rownum">Item ${i + 1}
            <button class="remove-btn" onclick="removePart1Row(${i})">✕ remove</button>
          </div>
          <div class="field"><label>Key Result Area (KRA)</label>
            <select id="kra_${i}_kra" onchange="onKraChange(${i})">
              <option value="">— Select KRA —</option>
              ${kraOpts}
              <option value="__other__" ${row.kra === "__other__" ? "selected" : ""}>Other (specify)</option>
            </select>
            ${selected ? `<div class="kra-hint">
              <div class="kra-hint-top">${selected.competency ? selected.competency + " · " : ""}Target proficiency: ${selected.level}</div>
              ${selected.definition ? `<div class="kra-hint-def">${selected.definition}</div>` : ""}
            </div>` : ""}
            ${row.kra === "__other__" ? `<input id="kra_${i}_kraOther" value="${row.kraOther || ""}" placeholder="Type the KRA...">` : ""}
          </div>
          <div class="field"><label>Key Performance Indicator (KPI)</label>
            <textarea id="kra_${i}_kpi" placeholder="Define the measurable KPI for this KRA...">${row.kpi || ""}</textarea></div>
          <div class="field"><label>% of Target</label>
            <input class="tgt-input" id="kra_${i}_tgt" value="${row.tgt || ""}" placeholder="e.g. 25%"
              oninput="updateWeightTotal()"></div>
          <div class="field"><label>Milestones / Projects</label>
            <textarea id="kra_${i}_mile" placeholder="Milestones...">${row.mile || ""}</textarea></div>
          <div class="field"><label>Critical Competencies to Develop</label>
            <textarea id="kra_${i}_comp" placeholder="Competencies...">${row.comp || ""}</textarea></div>`;

        const id = `p${pIdx}_r${i}`;
        const options = RATINGS.map(r =>
          `<option value="${r}">${r || "— Select rating —"}</option>`).join("");
        const input = document.createElement("div");
        input.className = "row-input";
        input.innerHTML = `
          <div><label>Individual Rating</label>
            <select id="${id}_rate">${options}</select></div>
          <div><label>Individual Comments</label>
            <textarea id="${id}_cmt" placeholder="Your comments..."></textarea></div>`;

        wrap.appendChild(ref);
        wrap.appendChild(input);
        container.appendChild(wrap);
      });

      const addBtn = document.createElement("button");
      addBtn.className = "add-btn";
      addBtn.textContent = "+ Add KRA / KPI";
      addBtn.onclick = () => { savePart1Inputs(); addPart1Row(); };
      container.appendChild(addBtn);

      const totalEl = document.createElement("div");
      totalEl.id = "weightTotal";
      totalEl.className = "weight-total";
      container.appendChild(totalEl);
      return;
    }

    part.rows.forEach((row, rIdx) => {
      const wrap = document.createElement("div");
      wrap.className = "row";
      let refHTML = `<div class="rownum">Item ${rIdx + 1}</div>`;
      part.refFields.forEach(([label, key]) => {
        refHTML += `<div class="field"><label>${label}</label>
          <div class="val">${row[key] || "—"}</div></div>`;
      });
      const ref = document.createElement("div");
      ref.className = "row-ref";
      ref.innerHTML = refHTML;

      const id = `p${pIdx}_r${rIdx}`;
      const options = RATINGS.map(r =>
        `<option value="${r}">${r || "— Select rating —"}</option>`).join("");
      const input = document.createElement("div");
      input.className = "row-input";
      input.innerHTML = `
        <div><label>Individual Rating</label>
          <select id="${id}_rate">${options}</select></div>
        <div><label>Individual Comments</label>
          <textarea id="${id}_cmt" placeholder="Your comments..."></textarea></div>`;
      wrap.appendChild(ref);
      wrap.appendChild(input);
      container.appendChild(wrap);
    });
  });

  if (priorState) restoreFormState(priorState);
  updateWeightTotal();
}

// ---- Weight (% of Target) tracking — all Part 1 KRA/KPI weights must sum to 100 ----
function parseWeight(v) {
  const n = parseFloat(String(v).replace("%", "").trim());
  return isNaN(n) ? 0 : n;
}
function sumPart1Weights() {
  let total = 0;
  part1Rows.forEach((row, i) => {
    const el = document.getElementById(`kra_${i}_tgt`);
    if (el) total += parseWeight(el.value);
  });
  return Math.round(total * 100) / 100;   // trim floating-point noise
}
function updateWeightTotal() {
  const el = document.getElementById("weightTotal");
  if (!el) return true;
  const total = sumPart1Weights();
  const ok = total === 100;
  if (ok) {
    el.textContent = `✓ KRA/KPI weights total ${total}%`;
    el.classList.add("weight-ok");
    el.style.display = "inline-block";
  } else {
    el.textContent = "";
    el.classList.remove("weight-ok");
    el.style.display = "none";
  }
  return ok;
}

// ---- Toast: pop up top-right when weights don't add up ----
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 4000);
}
// fires when the user leaves a weight field (not on every keystroke)
document.getElementById("parts").addEventListener("focusout", (e) => {
  if (!e.target.classList || !e.target.classList.contains("tgt-input")) return;
  const total = sumPart1Weights();
  if (total !== 100) {
    showToast(`KRA/KPI weights total ${total}% — must add up to exactly 100%`);
  }
});

// ---- COLLECT + BUILD FILLABLE PDF ----
async function collect() {
  const name = document.getElementById("empName").value.trim();
  if (!name) {
    alert("Please enter the employee name before saving.");
    document.getElementById("empName").focus();
    return;
  }
  const roleName = roleSelect.value;
  if (!roleName) {
    alert("Please select a role before saving.");
    roleSelect.focus();
    return;
  }

  savePart1Inputs();   // capture latest KRA/KPI field text

  const weightTotal = sumPart1Weights();
  if (weightTotal !== 100) {
    alert(`KRA/KPI weights must add up to exactly 100% before you can generate the PDF (currently ${weightTotal}%).`);
    document.getElementById("weightTotal")?.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }

  const DATA = ROLES[roleName];
  const out = [];
  Object.entries(DATA).forEach(([partName, part], pIdx) => {
    if (partName === "PART 1: GOALS / KRA / KPI") {
      part1Rows.forEach((row, i) => {
        const id = `p${pIdx}_r${i}`;
        out.push({
          part: partName,
          item: i + 1,
          rating: document.getElementById(`${id}_rate`).value,
          comment: document.getElementById(`${id}_cmt`).value,
          ref: { ...row, kraText: kraDisplayText(row) },
          refFields: part.refFields
        });
      });
      return;
    }

    part.rows.forEach((row, rIdx) => {
      const id = `p${pIdx}_r${rIdx}`;
      out.push({
        part: partName,
        item: rIdx + 1,
        rating: document.getElementById(`${id}_rate`).value,
        comment: document.getElementById(`${id}_cmt`).value,
        ref: row,
        refFields: part.refFields
      });
    });
  });

  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "Building PDF...";
  try {
    await buildPdf(name, roleName, out);
  } catch (e) {
    console.error(e);
    alert("Something went wrong building the PDF: " + e.message);
  }
  btn.disabled = false; btn.textContent = "Generate supervisor PDF";
}

async function buildPdf(name, roleName, rows) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const form = doc.getForm();

  const accent = rgb(0.004, 0.659, 0.863);
  const dark   = rgb(0.15, 0.15, 0.15);
  const grey   = rgb(0.42, 0.42, 0.42);

  const M = 45, PW = 612, PH = 792, CW = PW - M * 2;
  let page = doc.addPage([PW, PH]);
  let y = PH - M;

  function wrap(text, f, size, maxW) {
    const lines = [];
    (text || "").split("\n").forEach(para => {
      let line = "";
      para.split(" ").forEach(word => {
        const test = line ? line + " " + word : word;
        if (f.widthOfTextAtSize(test, size) > maxW && line) { lines.push(line); line = word; }
        else { line = test; }
      });
      lines.push(line);
    });
    return lines;
  }
  function need(space) { if (y - space < M) { page = doc.addPage([PW, PH]); y = PH - M; } }
  function drawText(text, f, size, color, x, maxW) {
    const lines = wrap(text, f, size, maxW);
    for (const ln of lines) {
      need(size + 4);
      page.drawText(ln, { x, y: y - size, size, font: f, color });
      y -= size + 3;
    }
  }

  page.drawText("Individual Development Plan — Year End Review", { x: M, y: y - 16, size: 16, font: bold, color: dark });
  y -= 26;
  page.drawText("Employee: " + name + "     Role: " + roleName, { x: M, y: y - 12, size: 11, font: font, color: grey });
  y -= 26;

  let fieldIdx = 0, lastPart = "";
  for (const r of rows) {
    if (r.part !== lastPart) {
      need(30); y -= 6;
      page.drawText(r.part, { x: M, y: y - 13, size: 13, font: bold, color: accent });
      y -= 20;
      page.drawLine({ start: { x: M, y }, end: { x: M + CW, y }, thickness: 1.5, color: accent });
      y -= 14; lastPart = r.part;
    }
    need(24);
    page.drawText(`Item ${r.item}`, { x: M, y: y - 11, size: 10, font: bold, color: accent });
    y -= 16;

    r.refFields.forEach(([label, key]) => {
      drawText(label.toUpperCase(), bold, 8, grey, M, CW);
      drawText(r.ref[key] || "—", font, 9, dark, M, CW);
      y -= 3;
    });
    y -= 4;

    drawText("EMPLOYEE RATING", bold, 8, grey, M, CW);
    drawText(r.rating || "—", font, 9, dark, M, CW);
    drawText("EMPLOYEE COMMENTS", bold, 8, grey, M, CW);
    drawText(r.comment || "—", font, 9, dark, M, CW);
    y -= 6;

    drawText("SUPERVISOR RATING", bold, 8, accent, M, CW);
    need(26);
    const dd = form.createDropdown(`sup_rating_${fieldIdx}`);
    dd.addOptions(RATING_CHOICES);
    dd.addToPage(page, { x: M, y: y - 20, width: 240, height: 18,
      textColor: dark, backgroundColor: rgb(1,1,1), borderColor: dark, borderWidth: 1, font });
    y -= 28;

    drawText("SUPERVISOR COMMENTS", bold, 8, accent, M, CW);
    need(56);
    const tf = form.createTextField(`sup_comment_${fieldIdx}`);
    tf.enableMultiline();
    tf.addToPage(page, { x: M, y: y - 50, width: CW, height: 48,
      textColor: dark, backgroundColor: rgb(1,1,1), borderColor: dark, borderWidth: 1, font });
    y -= 60;

    need(10);
    page.drawLine({ start: { x: M, y }, end: { x: M + CW, y }, thickness: 0.5, color: grey });
    y -= 12;
    fieldIdx++;
  }

  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  const bytes = await doc.save();
  const blob = new Blob([bytes], { type: "application/pdf" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${slug}_performance_report.pdf`;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
